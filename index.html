<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lead Generator Demo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page">
    <header class="header">
      <h1>Lead Generator Demo</h1>
      <p>Enter your criteria and click Run.</p>
    </header>

    <main class="card">
      <form id="lead-form" class="form">
        <div class="field">
          <label for="location">Location</label>
          <input id="location" name="location" type="text" placeholder="e.g., India" required />
        </div>

        <div class="field">
          <label for="employee_range">Employee range</label>
          <input id="employee_range" name="employee_range" type="text" placeholder="e.g., 1-10" required />
        </div>

        <div class="field">
          <label for="industry">Industry (optional)</label>
          <input id="industry" name="industry" type="text" placeholder="e.g., SaaS" />
        </div>

        <button id="run-button" type="submit">Run</button>
      </form>

      <div id="status" class="status" aria-live="polite"></div>
    </main>

    <footer class="footer">
      <small>Powered by Make.com webhook</small>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
